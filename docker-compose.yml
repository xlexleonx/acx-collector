services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: ./services/api
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # The API consumes the one-time bootstrap token after first activation.
      # This directory contains no persistent credentials; runtime keys stay in .env.
      - ./secrets:/run/secrets
      - ./vendor/zabbix-templates/templates:/catalog/zabbix:ro
    ports:
      - "${ACX_BIND_PORT:-8088}:8080"

  worker:
    build: ./services/api
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./secrets:/run/secrets:ro

